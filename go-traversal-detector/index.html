  {label:"handler vulnerável",name:"download.go",code:`package main

import (
	"net/http"
	"os"
	"path/filepath"
)

// Serve arquivos do diretório /srv/arquivos.
func download(w http.ResponseWriter, r *http.Request) {
	nome := r.URL.Query().Get("arquivo")
	caminho := filepath.Join("/srv/arquivos", nome) // ../../etc/passwd sai da raiz
	dados, err := os.ReadFile(caminho)
	if err != nil {
		http.Error(w, "não encontrado", 404)
		return
	}
	w.Write(dados)
}
`},
  {label:"handler protegido",name:"download_seguro.go",code:`package main

import (
	"net/http"
	"os"
	"path/filepath"
	"strings"
)

const base = "/srv/arquivos"

func downloadSeguro(w http.ResponseWriter, r *http.Request) {
	nome := r.URL.Query().Get("arquivo")
	caminho := filepath.Clean(filepath.Join(base, nome))
	if !strings.HasPrefix(caminho, base+string(os.PathSeparator)) {
		http.Error(w, "caminho inválido", 400)
		return
	}
	dados, err := os.ReadFile(caminho)
	if err != nil {
		http.Error(w, "não encontrado", 404)
		return
	}
	w.Write(dados)
}
`}]};
